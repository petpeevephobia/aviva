FLEXAM_HELP_AREAS_INTRO=Flexam To create tests, you must first create "AREAS OF KNOWLEDGE". The "Areas of Knowledge" will be visible if they are on the state "PUBLISHED."
FLEXAM_HELP_AREAS_ICONS=The icon menu lets you create new "AREAS OF KNOWLEDGE", edit and delete existing ones.
FLEXAM_HELP_AREAS_PUBLISH=To publish or unpublish "AREAS OF KNOWLEDGE" select the item and click on the icon of publication. You can press the icon in the column "Public" in the table list of elements to change the status of a specific item.
FLEXAM_HELP_AREAS_DELETE=To delete "AREAS OF KNOWLEDGE" select the item and click on the icon of elimination.
FLEXAM_HELP_AREAS_ADD=To add "AREAS OF KNOWLEDGE" press the Create icon.
FLEXAM_HELP_AREAS_EDIT=To edit "AREAS OF KNOWLEDGE" select the item and press the edit icon.
FLEXAM_HELP_AREAS_FORM_OPTIONS=In the form for editing or creating "AREAS OF KNOWLEDGE" option must complete the title. The image is an icon of 64 x 64 pixels or 18 MB. If you do not include a number assigned the System icon.
FLEXAM_HELP_SUBJECT_INTRO=Create "COURSES OF AREAS" allows for themes or issues on which future trials will be created. The "COURSES AREAS" will be visible if they meet the state "PUBLISHED."
FLEXAM_HELP_SUBJECT_ICONS=The icon menu lets you create new "COURSES OF AREAS", edit and delete existing ones.
FLEXAM_HELP_SUBJECT_PUBLISH=To publish or unpublish "COURSES OF AREAS" select the item and click on the icon of publication. You can press the icon in the column "Public" in the table list of elements to change the status of a specific item.
FLEXAM_HELP_SUBJECT_DELETE=To delete "COURSES OF AREAS" select the item and click on the icon of elimination.
FLEXAM_HELP_SUBJECT_ADD=To add "COURSES OF AREAS" press the Create icon.
FLEXAM_HELP_SUBJECT_EDIT=To edit "COURSES OF AREAS" select the item and press the edit icon.
FLEXAM_HELP_SUBJECT_FORM_OPTIONS=In the form to edit or create "COURSES OF PLACES", complete the options title, area of knowledge which depends on type, mail and code. The administrator mail is mail from the course supervisor, this person will be notified by each test performed. The code the value that will identify a course in communication with other servers or sections of your website. The "MODE" alters the body and recipient of the mail sent to the user where they are made aware of their results. Thus, the courses "CLOSED" will generate an email to the administrator and not the user. The courses "OPEN" sending mail to the administrator and the user with a summary of the results obtained.
FLEXAM_HELP_TEST_INTRO=The "testing the courses" allows you to set settings for future tests. A test is a measuring instrument should have instructions, level of difficulty, maximum grade, minimum and approval. These parameters are the basis for the algorithm for automatic correction test. The "testing the courses" will be visible if they meet the state "Publish".
FLEXAM_HELP_TEST_ICONS=The icon menu lets you create new "TESTS OF COURSE", edit and delete existing ones.
FLEXAM_HELP_TEST_PUBLISH=To publish or unpublish "TESTS OF COURSE" select the item and click on the icon of publication. You can press the icon in the column "Public" in the table list of elements to change the status of a specific item.
FLEXAM_HELP_TEST_DELETE=To delete "TEST COURSE" select the item and press the icon of elimination.
FLEXAM_HELP_TEST_ADD=To add "TESTS OF COURSE" press the Create icon.
FLEXAM_HELP_TEST_EDIT=To edit "TESTS OF COURSE" select the item and press the edit icon.
FLEXAM_HELP_TEST_FORM_OPTIONS=In the form to edit or create "testing the courses", complete the title options, instructions, during which depends difficulty, maximum grade, minimum and approval. The difficulty is related to the passing score, minimum and maximum, with these limits generates a scale related to the difficulty. For every point scored in the test increases the grade obtained on the basis of the scale.
FLEXAM_HELP_QUESTION_INTRO=Once you have set the test configuration in the "testing the courses", we can create the test questions. Each question has a score, type, correct answer, the body of the question and test to which it belongs. As a first step in the creation of questions, you must indicate the number of test questions and test to which it belongs.
FLEXAM_HELP_QUESTION_ICONS=The icon menu lets you create new "test questions", edit, copy and delete existing ones.
FLEXAM_HELP_QUESTION_COPY=To copy questions from one test to another, select a set of questions on the table and press the Copy icon. A form will be displayed indicating the proof of origin and allowing you to select the test target. Save your changes.
FLEXAM_HELP_QUESTION_DELETE=To eliminate "test questions" select the items and click on the icon of elimination.
FLEXAM_HELP_QUESTION_ADD=To add "quiz questions" press the Create icon.
FLEXAM_HELP_QUESTION_EDIT=To edit "test questions" select the item and press the edit icon.
FLEXAM_HELP_QUESTION_ADD_DET=The first step in creating questions is to identify the number and proof of which will be assigned.
FLEXAM_HELP_QUESTION_EDIT_DET=You can add or delete questions from a test. First, you must select a set of questions on the table and then press the Edit icon. The edit form will be displayed with options to add or delete questions. If you want to delete the selected questions from the field with the list of test questions and press the Continue button that is on the side. If you want to add, indicate the number of questions and press the Continue button, the questions appear at the end of the form with the ability to configure the same way as it did when it created the above questions.
FLEXAM_HELP_QUESTION_FORM_OPTIONS=The form creation and editing of "test questions" will allow you to ask questions in different formats considering:
FLEXAM_HELP_QUESTION_ALT=ALTERNATIVES: You can create questions with answers considering separating semicolon (;), no spaces should allow more than one correct answer. The correction of this type of question is strict, so it does not allocate part of the score if the answer is partially correct.
FLEXAM_HELP_QUESTION_REL=MATCHING: The logic of this type of question is similar to the questions of alternatives, for this reason should indicate the numbers of correct answers ordered sequentially. The correction of this type of question is strict, so it does not allocate part of the score if the answer is partially correct.
FLEXAM_HELP_QUESTION_TOF=TRUE OR FALSE: You should make sure to inform the user through the test instructions the word you have to use to answer such questions, it must match the word you said as a correct answer. The correction of this type of question is strict.
FLEXAM_HELP_QUESTION_OPN=OPEN: You must report a list of important concepts separated by (,) without spaces, such as right answer. Each concept corresponds to a point, so there must be total coherence between the concepts and the rating given to the question. The correction of this type of question assigns one point for every concept found in the list referred to in the text of user response.
FLEXAM_HELP_ANSWER_INTRO=Section test responses, allows you to review the results of the tests. In addition, you may mail or eliminate multiple responses simultaneously.
FLEXAM_HELP_ANSWER_ICONS=The icon menu allows you to post, view details and eliminate the existing responses.
FLEXAM_HELP_ANSWER_PREVIEW=To view a response from a test, select the item and click the Preview icon.
FLEXAM_HELP_ANSWER_DELETE=To remove existing responses, select the items and click on the icon of elimination.
FLEXAM_HELP_ANSWER_MAIL=To e-mail responses from a test, select the items and press the Send Mail icon. A summary of the results will be sent to the user and the administrator of the course.
FLEXAM_HELP_ANSWER_PRINT=Print a test result is simple, select the answer of the user and press the preview icon, then press the print icon.
FLEXAM_HELP_CONFIG_DELETE=To delete configuration settings click on the icon of elimination, this event will clean all the options and save changes.
FLEXAM_HELP_CONFIG_ADD=To set the configuration settings, complete the corresponding items and precione Save icon.
FLEXAM_HELP_CONFIG_INTRO=Possible to configure aspects of Flexam are:
FLEXAM_HELP_CONFIG_TITLE_TEST=Title for the section: You can set a title on the page that the user can see. This information is useful to differentiate a company or purpose of the component.
FLEXAM_HELP_CONFIG_STACK_MODE=Single test mode: Allows users to a restriction on the number of times you can perform a test. By default the option is enabled preventing a test to be conducted more than once. By disabling this option, users who have logged in and hold a test may be repeated without restriction, while users who access for server connection, may repeat if they have a different application code. Where there is more than a test for a course given by users accessing server connection with the same application code, perform the following tests of the battery.
FLEXAM_HELP_CONFIG_REQSERV=Server query: can extract, report and log the data obtained from a website or remote server. Setting this option, the request remote access ambiete pointing to the URL "http:// [my dns] / index.php? Option=com_flexam [ampersand] cc=[code]", defining code such as "APPLICATION CODE", Flexam locate the server by sending the code to query an external application returns data in format [USER NAME]:: [MAIL USER]:: [CODE OF COURSE], with these user data is generated automatically if not exist and meeting will start sending the first of the tests created for the course.
FLEXAM_HELP_CONFIG_RESPSERV=Server Confirmation: Allows management of the site or server that sends the application code for users who have accessed by connecting servers. The idea is to have an application on this page, to consult on the basis of the said Code, the approval status of the user. The application should check the status of approval of the URL="http:// [my dns] / components / com_flexam / result.php? Id=[code]"
FLEXAM_HELP_CONFIG_TIME=Time redirect: For a user to access by connecting servers, at the end of your test will be sent to the Web address noted in this space.
FLEXAM_HELP_CONFIG_MAILSERV=Data for mail attachments: Allows a URL from which is extracted by a system function, data to be included in the body of the mail. For example, you can have a page with listings of courses to apply, these listings are included in the mail if you assign the web address.