EASYBOOK IS A NATIV JOOMLA 1.5 GUESTBOOK COMPONENT=Easybook Reloaded is a native Joomla! 1.5 component with many features!<br /><br />Further procedure:<br />1. Configure the guestbook under "Components" - "Easybook Reloaded" - "Settings". Important: Set secret word and the group for adding an entry!<br />2. Set a link under "Menus".<br /><br />Have fun with the component - <a href="http://joomla-extensions.kubik-rubik.de" title="Kubik-Rubik.de" target="_blank">Viktor Vogel</a>
