FLEXAM_HELP_AREAS_INTRO=Flexam Pour créer des tests, vous devez d`abord créer des "domaines de la connaissance". Les régions de la connaissance sera visible que si elles sont à l`état "publié".
FLEXAM_HELP_AREAS_ICONS=Le menu de l`icône vous permet de créer de nouveaux "domaines de la connaissance", modifier et supprimer ceux qui existent déjà.
FLEXAM_HELP_AREAS_PUBLISH=Pour publier ou dépublier "domaines de la connaissance", sélectionnez-le et cliquez sur l`icône de la publication. Vous pouvez appuyer sur l`icône dans la colonne "public" dans la liste des tables d`éléments à modifier le statut d`un élément spécifique.
FLEXAM_HELP_AREAS_DELETE=Pour supprimer "domaines de la connaissance", sélectionnez-le et cliquez sur l`icône de l`élimination.
FLEXAM_HELP_AREAS_ADD=Pour ajouter "domaines de la connaissance", appuyez sur l`icône Créer.
FLEXAM_HELP_AREAS_EDIT=Pour modifier "domaines de la connaissance", sélectionnez l`élément et appuyez sur l`icône d`édition.
FLEXAM_HELP_AREAS_FORM_OPTIONS=Dans la forme pour l`édition ou la création de "domaines de la connaissance" doit compléter le titre. L`image est une icône de 64 x 64 pixels ou 18 MB. Si vous n`incluez pas un numéro attribué sur l`icône Système.
FLEXAM_HELP_SUBJECT_INTRO=Créer "COURS DES ZONES" permet de thèmes ou de questions sur lesquelles les essais à venir seront créés. Le "COURS DES ZONES" sera visible que si elles satisfont l`état "publié".
FLEXAM_HELP_SUBJECT_ICONS=Le menu de l`icône vous permet de créer de nouveaux "COURS DES ZONES", modifier et supprimer ceux qui existent déjà.
FLEXAM_HELP_SUBJECT_PUBLISH=Pour publier ou dépublier "COURS DES ZONES", sélectionnez-le et cliquez sur l`icône de la publication. Vous pouvez appuyer sur l`icône dans la colonne "public" dans la liste des tables d`éléments à modifier le statut d`un élément spécifique.
FLEXAM_HELP_SUBJECT_DELETE=Pour supprimer "COURS DES ZONES", sélectionnez-le et cliquez sur l`icône de l`élimination.
FLEXAM_HELP_SUBJECT_ADD=Pour ajouter "COURS DES ZONES" appuyez sur l`icône Créer.
FLEXAM_HELP_SUBJECT_EDIT=Pour modifier "COURS DES ZONES", sélectionnez l`élément et appuyez sur l`icône d`édition.
FLEXAM_HELP_SUBJECT_FORM_OPTIONS=Dans le formulaire pour modifier ou créer des "cours de places", complète le titre options, domaine de la connaissance, qui dépend du type, du courrier et de code. Le courrier électronique est l`administrateur de la responsable du cours, cette personne sera communiquée par chaque test effectué. Le code de la valeur qui permettra de déterminer un cours de communication avec d`autres serveurs ou des sections de votre site Web. "Mode" modifie le corps et le destinataire du mail envoyé à l`utilisateur où ils sont mis au courant de leurs résultats. Ainsi, le cours "FERME" va générer un e-mail à l`administrateur et non l`utilisateur. Les cours "OPEN" l`envoi de courrier à l`administrateur et l`utilisateur avec un résumé des résultats obtenus.
FLEXAM_HELP_TEST_INTRO=Le "tester les cours" vous permet de définir des paramètres pour les essais futurs. Un test est un instrument de mesure devrait avoir des instructions, le niveau de difficulté, note maximale, minimale et d`approbation. Ces paramètres sont la base de l`algorithme pour le test de correction automatique. Le "tester les cours" sera visible que si elles satisfont l`état "Publier".
FLEXAM_HELP_TEST_ICONS=Le menu de l`icône vous permet de créer de nouveaux "tests bien sûr", modifier et supprimer ceux qui existent déjà.
FLEXAM_HELP_TEST_PUBLISH=Pour publier ou dépublier "ESSAIS DE COURS", sélectionnez-le et cliquez sur l`icône de la publication. Vous pouvez appuyer sur l`icône dans la colonne "public" dans la liste des tables d`éléments à modifier le statut d`un élément spécifique.
FLEXAM_HELP_TEST_DELETE=Pour supprimer "TEST DE COURS", sélectionnez l`élément et appuyez sur l`icône de l`élimination.
FLEXAM_HELP_TEST_ADD=Pour ajouter "ESSAIS DE COURS" appuyez sur l`icône Créer.
FLEXAM_HELP_TEST_EDIT=Pour modifier "ESSAIS DE COURS", sélectionnez l`élément et appuyez sur l`icône d`édition.
FLEXAM_HELP_TEST_FORM_OPTIONS=Dans le formulaire pour modifier ou créer des "tester les cours", veuillez remplir les options titre, des instructions, au cours de laquelle dépend la difficulté, note maximale, minimale et d`approbation. La difficulté est liée à la note de passage, minimale et maximale, ces limites génère une échelle liées à la difficulté. Pour chaque point marqué lors de l`essai augmente la note obtenue sur la base de l`échelle.
FLEXAM_HELP_QUESTION_INTRO=Une fois que vous avez défini la configuration de test dans le "tester les cours", nous pouvons créer les questions d`examen. Chaque question a un score, le type, la bonne réponse, le corps de la question et d`essai à laquelle il appartient. Dans une première étape dans la création de questions, vous devez indiquer le nombre de questions d`examen et d`essai à laquelle il appartient.
FLEXAM_HELP_QUESTION_ICONS=Le menu de l`icône vous permet de créer de nouvelles questions "test", modifier, copier et supprimer ceux qui existent déjà.
FLEXAM_HELP_QUESTION_COPY=Pour copier questions d`un test à l`autre, sélectionnez une série de questions sur la table et appuyez sur l`icône Copier. Un formulaire sera affichée pour indiquer la preuve de l`origine et vous permettant de sélectionner la cible. Enregistrez vos modifications.
FLEXAM_HELP_QUESTION_DELETE=Pour éliminer les "questions d`essai" de sélectionner les éléments et cliquez sur l`icône de l`élimination.
FLEXAM_HELP_QUESTION_ADD=Pour ajouter "questions quiz", appuyez sur l`icône Créer.
FLEXAM_HELP_QUESTION_EDIT=Pour modifier "les questions d`examen", sélectionnez l`élément et appuyez sur l`icône d`édition.
FLEXAM_HELP_QUESTION_ADD_DET=La première étape dans la création de questions est de déterminer le nombre et la preuve de ce qui sera attribué.
FLEXAM_HELP_QUESTION_EDIT_DET=Vous pouvez ajouter ou supprimer des questions d`un test. Tout d`abord, vous devez sélectionner une série de questions sur la table et puis appuyez sur l`icône Modifier. Le formulaire d`édition s`affiche avec des options pour ajouter ou supprimer des questions. Si vous souhaitez supprimer des questions choisies sur le terrain avec la liste des questions du test et appuyez sur le bouton Continuer qui se trouve sur le côté. Si vous souhaitez ajouter, indiquer le nombre de questions et appuyez sur le bouton Continuer, les questions figurent à la fin de la forme avec la possibilité de configurer la même manière qu`il a fait quand il a créé les questions ci-dessus.
FLEXAM_HELP_QUESTION_FORM_OPTIONS=Le formulaire de création et d`édition des "questions" test vous permettra de poser des questions dans différents formats en tenant compte:
FLEXAM_HELP_QUESTION_ALT=ALTERNATIVES: Vous pouvez créer des questions avec des réponses envisage séparant point-virgule (;), pas d`espace devrait permettre à plus d`une réponse correcte. La correction de ce type de question est stricte, afin de ne pas affecter une partie de la note si la réponse est partiellement correcte.
FLEXAM_HELP_QUESTION_REL=ADAPTATION: La logique de ce type de question est semblable à la question des alternatives, pour cette raison doit indiquer le nombre de réponses correctes classés de façon séquentielle. La correction de ce type de question est stricte, afin de ne pas affecter une partie de la note si la réponse est partiellement correcte.
FLEXAM_HELP_QUESTION_TOF=VRAI OU FAUX: Vous devez vous assurer d`informer l`utilisateur à travers les instructions du test le mot que vous avez à utiliser pour répondre à ces questions, il doit correspondre au mot que vous a dit comme une réponse correcte. La correction de ce type de question est de rigueur.
FLEXAM_HELP_QUESTION_OPN=OPEN: Vous devez vous présenter une liste de concepts importants séparés par (,) sans espaces, tels que la bonne réponse. Chaque concept correspond à un point, alors il doit y avoir une cohérence totale entre les concepts et la notation attribuée à la question. La correction de ce type de question assigne un point pour chaque concept dans la liste visée dans le texte de la réponse de l`utilisateur.
FLEXAM_HELP_ANSWER_INTRO=test Section des réponses, vous permet de revoir les résultats des tests. En outre, vous pouvez envoyer ou à éliminer les réponses multiples simultanément.
FLEXAM_HELP_ANSWER_ICONS=Le menu de l`icône vous permet de publier, afficher et d`éliminer les réponses existantes.
FLEXAM_HELP_ANSWER_PREVIEW=Pour voir une réponse d`un test, sélectionnez-le et cliquez sur l`icône Aperçu.
FLEXAM_HELP_ANSWER_DELETE=Pour supprimer les réponses existantes, sélectionnez les éléments et cliquez sur l`icône de l`élimination.
FLEXAM_HELP_ANSWER_MAIL=Réponses Pour e-mail à partir d`un test, sélectionnez les éléments et appuyez sur l`icône d`envoi de courrier. Un résumé des résultats sera envoyé à l`utilisateur et l`administrateur du cours.
FLEXAM_HELP_ANSWER_PRINT=Imprimer un résultat de test est simple, sélectionnez la réponse de l`utilisateur et appuyez sur l`icône de prévisualisation, puis appuyez sur l`icône d`impression.
FLEXAM_HELP_CONFIG_DELETE=Pour supprimer des paramètres de configuration cliquez sur l`icône de l`élimination, cette manifestation va nettoyer toutes les options et enregistrez les modifications.
FLEXAM_HELP_CONFIG_ADD=Pour définir les paramètres de configuration, remplissez les rubriques correspondantes et precione icône Enregistrer.
FLEXAM_HELP_CONFIG_INTRO=Possibilité de configurer les aspects de la Flexam sont les suivants:
FLEXAM_HELP_CONFIG_TITLE_TEST=Titre de la section: Vous pouvez définir un titre sur la page que l`utilisateur peut voir. Cette information est utile pour différencier une entreprise ou le but de la composante.
FLEXAM_HELP_CONFIG_STACK_MODE=mode test simple: Permet aux utilisateurs d`une restriction sur le nombre de fois où vous pouvez effectuer un test. Par défaut l`option est activée empêcher qu`un essai soit effectué plus d`une fois. En désactivant cette option, les utilisateurs qui ont ouvert une session et titulaire d`un essai peut être répétée sans restriction, alors que les utilisateurs qui accèdent pour la connexion au serveur, peut répéter si elles ont un code d`application différents. Là où il ya plus d`un essai pour un cours donné par les utilisateurs accédant à la connexion au serveur avec le code de l`application même, effectuer les tests suivants de la batterie.
FLEXAM_HELP_CONFIG_REQSERV=requête de serveur: permet d`extraire, de signaler et enregistrer les données obtenues à partir d`un serveur Web ou à distance. La définition de cette option, la demande d`accès à distance Ambiete pointant vers l`URL "http:// [mon dns] / index.php?option=com_flexam[esperluette]cc=[code]", la définition de code comme "code d`application", Flexam localiser le serveur en envoyant le code pour interroger une application externe renvoie les données au format [nom d`utilisateur]:: [Mail User]:: [CODE DE COURS], avec ces données de l`utilisateur est généré automatiquement s`il n`existe pas et la réunion commencera à envoyer les premier des tests créés pour le cours.
FLEXAM_HELP_CONFIG_RESPSERV=Server Confirmation: Permet la gestion du site ou le serveur qui envoie le code d`application pour les utilisateurs qui ont consulté en connectant des serveurs. L`idée est d`avoir une application sur cette page, à consulter sur la base de ce code, le statut d`approbation de l`utilisateur. La demande doit vérifier l`état de l`approbation de l`URL="http:// [mon dns]/components/com_flexam/result.php?Id=[code]"
FLEXAM_HELP_CONFIG_TIME=Temps de redirection: Pour un utilisateur d`accéder en vous connectant des serveurs, à la fin de votre test sera envoyé à l`adresse Web de noter à cet espace.
FLEXAM_HELP_CONFIG_MAILSERV=Les données de mail des pièces jointes: Permet une URL à partir de laquelle est extrait par une fonction système, les données à inclure dans le corps du mail. Par exemple, vous pouvez avoir une page avec des annonces de cours à appliquer, ces annonces sont inclus dans l`e-mail si vous attribuez l`adresse web.