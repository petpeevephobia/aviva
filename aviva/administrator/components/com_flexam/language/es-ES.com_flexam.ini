FLEXAM_COPYRIGHTS=Flexible Generator Tests v2.1.1 ©APComputación.cl Copyright 2010-2012 Todos los derechos reservados.
FLEXAM_HELP_AREAS_INTRO=Para crear pruebas en FLEXAM, primero debe crear "ÁREAS DE CONOCIMIENTO". Las "ÁREAS DE CONOCIMIENTO" serán visibles si cumplen con el estado "PUBLICADO".
FLEXAM_HELP_AREAS_ICONS=El menú de iconos le permitirá crear nuevas "ÁREAS DE CONOCIMIENTO", editar y eliminar las existentes.
FLEXAM_HELP_AREAS_PUBLISH=Para publicar o despublicar "ÁREAS DE CONOCIMIENTO" seleccione el ítem y presione el icono de publicación. Puede presionar el icono de la columna "PUBLICADO" en la tabla de listado de elementos para cambiar el estado de un elemento específico.
FLEXAM_HELP_AREAS_DELETE=Para eliminar "ÁREAS DE CONOCIMIENTO" seleccione el ítem y presione el icono de eliminación.
FLEXAM_HELP_AREAS_ADD=Para agregar "ÁREAS DE CONOCIMIENTO" presione el icono de Crear.
FLEXAM_HELP_AREAS_EDIT=Para editar "ÁREAS DE CONOCIMIENTO" seleccione el ítem y presione el icono de editar.
FLEXAM_HELP_AREAS_FORM_OPTIONS=En el formulario para editar o crear "ÁREAS DE CONOCIMIENTO", debe completar la opción de título. La imagen corresponde a un icono de 64 X 64 pixeles o 18 MB. Si usted no incluye una, se asignará el icono del sistema.
FLEXAM_HELP_SUBJECT_INTRO=Crear "CURSOS DE LAS ÁREAS" permite establecer temas o materias sobre las que se crearán futuras pruebas. Los "CURSOS DE LAS ÁREAS" serán visibles si cumplen con el estado "PUBLICADO".
FLEXAM_HELP_SUBJECT_ICONS=El menú de iconos le permitirá crear nuevos "CURSOS DE LAS ÁREAS", editar y eliminar los existentes.
FLEXAM_HELP_SUBJECT_PUBLISH=Para publicar o despublicar "CURSOS DE LAS ÁREAS" seleccione el ítem y presione el icono de publicación. Puede presionar el icono de la columna "PUBLICADO" en la tabla de listado de elementos para cambiar el estado de un elemento específico.
FLEXAM_HELP_SUBJECT_DELETE=Para eliminar "CURSOS DE LAS ÁREAS" seleccione el ítem y presione el icono de eliminación.
FLEXAM_HELP_SUBJECT_ADD=Para agregar "CURSOS DE LAS ÁREAS" presione el icono de Crear.
FLEXAM_HELP_SUBJECT_EDIT=Para editar "CURSOS DE LAS ÁREAS" seleccione el ítem y presione el icono de editar.
FLEXAM_HELP_SUBJECT_FORM_OPTIONS=En el formulario para editar o crear "CURSOS DE LAS ÁREAS", debe completar las opciones de título, área de conocimiento de la cual depende, modalidad, mail y código. El mail del administrador es el correo del supervisor del curso, esta persona recibirá una notificación por cada prueba realizada. El código el un valor que permitirá identificar un curso en la comunicación con otros servidores o secciones de su sitio web. La "MODALIDAD" altera el cuerpo y destinatario del correo enviado al usuario donde se dan a conocer sus resultados. De esta forma, los cursos "CERRADOS" generarán un correo al administrador y NO al usuario. Los cursos "ABIERTOS" envían correo al administrador y al usuario con un resumen del resultado obtenido.
FLEXAM_HELP_TEST_INTRO=Las "PRUEBAS DE LOS CURSOS" permite establecer la configuración de futuras pruebas. Una prueba es un instrumento de medición que debe tener instrucciones, grado de dificultad, calificación máxima, mínima y de aprobación. Estos parámetros, son la base para el algoritmo de corrección automática de la prueba. Las "PRUEBAS DE LOS CURSOS" serán visibles si cumplen con el estado "PUBLICADO".
FLEXAM_HELP_TEST_ICONS=El menú de iconos le permitirá crear nuevas "PRUEBAS DE LOS CURSOS", editar y eliminar las existentes.
FLEXAM_HELP_TEST_PUBLISH=Para publicar o despublicar "PRUEBAS DE LOS CURSOS" seleccione el ítem y presione el icono de publicación. Puede presionar el icono de la columna "PUBLICADO" en la tabla de listado de elementos para cambiar el estado de un elemento específico.
FLEXAM_HELP_TEST_DELETE=Para eliminar "PRUEBAS DE LOS CURSOS" seleccione el ítem y presione el icono de eliminación.
FLEXAM_HELP_TEST_ADD=Para agregar "PRUEBAS DE LOS CURSOS" presione el icono de Crear.
FLEXAM_HELP_TEST_EDIT=Para editar "PRUEBAS DE LOS CURSOS" seleccione el ítem y presione el icono de editar.
FLEXAM_HELP_TEST_FORM_OPTIONS=En el formulario para editar o crear "PRUEBAS DE LOS CURSOS", debe completar las opciones de título, instrucciones, curso de la cual depende, dificultad, calificación máxima, mínima y de aprobación. La dificultad está relacionada con la calificación de aprobación, mínima y máxima, con estos límites se genera una escala relacionada con la dificultad. Por cada punto obtenido en la prueba aumenta la calificación obtenida en función de la escala.
FLEXAM_HELP_QUESTION_INTRO=Una vez que se ha establecido la configuración de las pruebas en la sección "PRUEBAS DE LOS CURSOS", podemos crear la preguntas de los test. Cada pregunta tiene un puntaje, tipo, respuesta correcta, cuerpo de la pregunta y prueba a la que pertenece. Como primer paso en la creación de preguntas, usted deberá señalar el número de preguntas de la prueba y la prueba a la cual pertenece.
FLEXAM_HELP_QUESTION_ICONS=El menú de iconos le permitirá crear nuevas "PREGUNTAS DE LAS PRUEBAS", editar, copiar y eliminar las existentes.
FLEXAM_HELP_QUESTION_COPY=Para copiar las preguntas de una prueba hacia otra, seleccione un set de preguntas de la tabla y presione el icono de Copiar. Un formulario se desplegará señalando la prueba de origen y permitiendo seleccionar la prueba de destino. Guarde los cambios.
FLEXAM_HELP_QUESTION_DELETE=Para eliminar "PREGUNTAS DE LAS PRUEBAS" seleccione los ítems y presione el icono de eliminación.
FLEXAM_HELP_QUESTION_ADD=Para agregar "PREGUNTAS DE LAS PRUEBAS" presione el icono de Crear.
FLEXAM_HELP_QUESTION_EDIT=Para editar "PREGUNTAS DE LAS PRUEBAS" seleccione el ítem y presione el icono de editar.
FLEXAM_HELP_QUESTION_ADD_DET=El primer paso para crear preguntas es señalar la cantidad y la prueba a la cual serán asignadas.
FLEXAM_HELP_QUESTION_EDIT_DET=Es posible agregar o eliminar preguntas de una prueba. Primero, usted deberá seleccionar un set de preguntas de la tabla y luego presionar el icono de Editar. El formulario de edición será desplegado con las opciones de agregar o eliminar preguntas. Si usted desea Eliminar, seleccione las preguntas desde el campo con el listado de preguntas de la prueba y presione el botón continuar que se encuentra a un costado. Si desea agregar, señale el número de preguntas y presione el botón continuar, las preguntas aparecerán al final del formulario con la posibilidad de configurarlas del mismo modo que lo hizo cuando creó las anteriores preguntas.
FLEXAM_HELP_QUESTION_FORM_OPTIONS=El formulario de creación y edición de "PREGUNTAS DE LAS PRUEBAS", le permitirá realizar preguntas en distintos formatos considerando:
FLEXAM_HELP_QUESTION_ALT=ALTERNATIVAS: Usted puede crear preguntas de alternativas considerando separar las respuestas por punto y coma (;), sin espacios en caso de permitir mas de una respuesta correcta. La corrección de este tipo de pregunta es estricta, por lo que NO asigna parte del puntaje si la respuesta esta parcialmente correcta.
FLEXAM_HELP_QUESTION_REL=TERMINOS PAREADOS: La lógica de este tipo de pregunta es similar a las preguntas de alternativas, por este motivo deberá señalar los números de las respuestas correctas ordenados de forma secuencial. La corrección de este tipo de pregunta es estricta, por lo que NO asigna parte del puntaje si la respuesta esta parcialmente correcta.
FLEXAM_HELP_QUESTION_TOF=VERDADERO O FALSO: Deberá asegurarse de informar al usuario mediante las instrucciones de la prueba la palabra que tiene que usar al responder este tipo de pregunta, ella debe coincidir con la palabra que usted señaló como respuesta correcta. La corrección de este tipo de pregunta es estricta.
FLEXAM_HELP_QUESTION_OPN=ABIERTA:  Usted deberá señalar una lista de conceptos importantes separados por (;) y sin espacios, como respuesta correcta. Cada concepto equivale a un punto,por lo que debe existir coherencia entre el total de conceptos y el puntaje asignado a la pregunta. La corrección de este tipo de pregunta asigna un punto por cada concepto encontrado de la lista señalada en el texto de respuesta del usuario.
FLEXAM_HELP_ANSWER_INTRO=La sección respuestas de las pruebas, permite revisar los resultados de las pruebas realizadas. Además, es posible enviar por correo o eliminar multiples respuestas en forma simultánea.
FLEXAM_HELP_ANSWER_ICONS=El menú de iconos le permitirá enviar por correo, visualizar detalles y eliminar las respuestas existentes.
FLEXAM_HELP_ANSWER_PREVIEW=Para visualizar una respuesta de una prueba, seleccione el ítem y presione el icono de Vista Previa.
FLEXAM_HELP_ANSWER_DELETE=Para eliminar las respuestas existentes, seleccione los ítems y presione el icono de eliminación.
FLEXAM_HELP_ANSWER_MAIL=Para enviar por correo las respuestas de una prueba, seleccione los ítems y presione el icono de Enviar por Correo. Una resumen del resultado será enviado al usuario y al administrador del curso.
FLEXAM_HELP_ANSWER_PRINT=Imprimir el resultado de una prueba es sencillo, seleccione la respuesta del usuario y presione el icono de vista previa, luego presione el icono de imprimir.
FLEXAM_HELP_CONFIG_DELETE=Para eliminar las opciones de configuración presione el icono de eliminación, este evento limpiará todas las opciones y guardará los cambios realizados.
FLEXAM_HELP_CONFIG_ADD=Para establecer las opciones de configuración, llene los ítems correspondientes y precione el icono Guardar.
FLEXAM_HELP_CONFIG_INTRO=Los aspectos posibles de configurar de FLEXAM son:
FLEXAM_HELP_CONFIG_TITLE_TEST=Título para la sección: Permite establecer un título en la página que puede ver el usuario. Este elemento es de utilidad para diferenciar una empresa o finalidad del componente.
FLEXAM_HELP_CONFIG_STACK_MODE=Modalidad de prueba única: Permite establecer una restricción a los usuarios en la cantidad de veces que puede realizar una prueba. Por defecto la opción se encuentra habilitada impidiendo que una prueba sea realizada mas de una vez. Al deshabilitar esta opción, los usuarios que han iniciado sesión y rindan una prueba, podrán repetirla sin restricción, mientras que los usuarios que accedan por conexión de servidor, podrán repetirla siempre que cuenten con un código de postulación distinto. En el caso de existir mas de una prueba para un curso dado, los usuarios que accedan por conexión de servidor con el mismo código de postulación, realizarán las siguientes pruebas de la pila.
FLEXAM_HELP_CONFIG_REQSERV=Servidor de consulta: Permite extraer, comunicar e iniciar sesión con los datos obtenidos desde una página web o servidor remoto. Al establecer esta opción, el ambiete remoto solicitará acceso señalando la URL "http://[mi dns]/index.php?option=com_flexam[ampersand]cc=[código]", definiendo código como "CÓDIGO DE POSTULACIÓN", FLEXAM localizará el servidor de consulta enviando el código para que una aplicación externa retorne los datos en formato [NOMBRE USUARIO]::[MAIL USUARIO]::[CÓDIGO DE CURSO], con estos datos se generára el usuario en forma automática si no existe y se iniciará sesión enviándolo a la primera de las pruebas creadas para el curso.
FLEXAM_HELP_CONFIG_RESPSERV=Servidor de confirmación: Permite establecer la dirección de la página o servidor donde se envía el código de postulación de aquellos usuarios que han accedido por conexión de servidores. La idea, es contar con una aplicación en esta página, que consulte en base al mencionado código, el estado de aprobación del usuario. La aplicación deberá consultar el estado de aprobación a la URL = "http://[mi dns]/components/com_flexam/result.php?id=[código]"
FLEXAM_HELP_CONFIG_TIME=Tiempo de redirección: En el caso que un usuario acceda mediante conexión de servidores, al terminar su prueba será enviado a la dirección web señalada en este espacio.
FLEXAM_HELP_CONFIG_MAILSERV=Datos anexos para mail: Permite establecer una URL de donde se extraera mediante una función del sistema, datos que se incluirán en el cuerpo del mail. A modo de ejemplo, usted puede tener una página con listados de cursos para postular, estos listados se incluirán en el mail si usted asigna esa dirección web.