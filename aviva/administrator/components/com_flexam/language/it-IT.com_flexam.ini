FLEXAM_HELP_AREAS_INTRO=Flexam Per creare test, è necessario innanzitutto creare "aree della conoscenza". Le "aree della conoscenza" sarà visibile se sono sullo stato "pubblicato".
FLEXAM_HELP_AREAS_ICONS=Il menu a icone consente di creare nuove "aree di conoscenza", modificare e cancellare quelli esistenti.
FLEXAM_HELP_AREAS_PUBLISH=Per pubblicare o annullare la pubblicazione di "aree di conoscenza", selezionare la voce e fare clic sull`icona della pubblicazione. È possibile premere l`icona nella colonna "pubblico" nella lista tavola degli elementi per modificare lo stato di un elemento specifico.
FLEXAM_HELP_AREAS_DELETE=Per eliminare i "campi della conoscenza", selezionare la voce e fare clic sull`icona di eliminazione.
FLEXAM_HELP_AREAS_ADD="Per aggiungere aree di conoscenza" premere l`icona Create.
FLEXAM_HELP_AREAS_EDIT=Per modificare le "aree di conoscenza", selezionare la voce e premere l`icona di modifica.
FLEXAM_HELP_AREAS_FORM_OPTIONS=Nel modulo per la modifica o la creazione di "aree di conoscenza" deve completare il titolo. L`immagine è un`icona di 64 x 64 pixel e 18 MB. Se non si include un numero assegnato sull`icona Sistema.
FLEXAM_HELP_SUBJECT_INTRO="corsi di spazi", permette di temi o questioni su cui gli studi futuri sarà creato. Il "CORSI aree" sarà visibile se rispondono lo stato "pubblicato".
FLEXAM_HELP_SUBJECT_ICONS=Il menu a icone consente di creare nuovi "Corsi di spazi", modificare e cancellare quelli esistenti.
FLEXAM_HELP_SUBJECT_PUBLISH=Per pubblicare o annullare la pubblicazione "Corsi di spazi", selezionare la voce e fare clic sull`icona della pubblicazione. È possibile premere l`icona nella colonna "pubblico" nella lista tavola degli elementi per modificare lo stato di un elemento specifico.
FLEXAM_HELP_SUBJECT_DELETE=Per eliminare i "Corsi di spazi", selezionare la voce e fare clic sull`icona di eliminazione.
FLEXAM_HELP_SUBJECT_ADD="Per aggiungere Corsi di spazi", premere l`icona Create.
FLEXAM_HELP_SUBJECT_EDIT=Per modificare "Corsi di spazi", selezionare la voce e premere l`icona di modifica.
FLEXAM_HELP_SUBJECT_FORM_OPTIONS=In forma per modificare o creare "corsi dei luoghi", il titolo completo delle opzioni, l`area della conoscenza che dipende dal tipo, la mail e il codice. La posta amministratore è posta dal supervisore del corso, questa persona sarà notificata da ogni test effettuato. Il codice il valore che identifica un corso di comunicazione con altri server o sezioni del tuo sito web. Il "MODE" altera il corpo e il destinatario della mail inviata all`utente dove sono messi al corrente dei loro risultati. Così, i corsi di "CHIUSO" genererà una e-mail all`amministratore e non l`utente. I corsi "OPEN" l`invio di mail all`amministratore e l`utente con una sintesi dei risultati ottenuti.
FLEXAM_HELP_TEST_INTRO=La "sperimentazione dei corsi" permette di impostare le impostazioni per le prove future. Una prova è uno strumento di misura deve aver ricevuto istruzioni, livello di difficoltà, grado massimo, minimo e l`approvazione. Questi parametri sono la base per l`algoritmo per la prova di correzione automatica. La "sperimentazione dei corsi" sarà visibile se rispettano lo Stato "Pubblica".
FLEXAM_HELP_TEST_ICONS=Il menu a icone consente di creare nuovi "PROVE DEL CORSO", modificare e cancellare quelli esistenti.
FLEXAM_HELP_TEST_PUBLISH=Per pubblicare o annullare la pubblicazione "PROVE DEL CORSO" selezionare la voce e fare clic sull`icona della pubblicazione. È possibile premere l`icona nella colonna "pubblico" nella lista tavola degli elementi per modificare lo stato di un elemento specifico.
FLEXAM_HELP_TEST_DELETE=Per eliminare i "TEST CORSO" selezionare la voce e premere l`icona di eliminazione.
FLEXAM_HELP_TEST_ADD=Per aggiungere "PROVE DEL CORSO" premere l`icona Create.
FLEXAM_HELP_TEST_EDIT=Per modificare "PROVE DEL CORSO" selezionare la voce e premere l`icona di modifica.
FLEXAM_HELP_TEST_FORM_OPTIONS=In forma per modificare o creare "la sperimentazione dei corsi", completare le opzioni di titolo, le istruzioni, durante il quale dipende in difficoltà, il grado massimo, minimo e l`approvazione. La difficoltà è legata al punteggio che passa, minima e massima, con questi limiti genera una scala legate alla difficoltà. Per ogni punto segnato nella prova aumenta il punteggio ottenuto sulla base della scala.
FLEXAM_HELP_QUESTION_INTRO=Una volta impostata la configurazione di prova nella "sperimentazione dei corsi", possiamo creare le domande del test. Ogni domanda ha un punteggio, tipo, risposta esatta, il corpo della questione e prova a cui appartiene. Come primo passo nella creazione di domande, si deve indicare il numero di domande e prova a cui appartiene.
FLEXAM_HELP_QUESTION_ICONS=Il menu a icone consente di creare nuove "domande di prova", modificare, copiare e cancellare quelli esistenti.
FLEXAM_HELP_QUESTION_COPY=Per copiare le domande da una prova all`altra, selezionare una serie di domande sul tavolo e premere l`icona Copia. Un modulo sarà visualizzato indica la prova di origine e che consente di selezionare il target di prova. Salvare le modifiche.
FLEXAM_HELP_QUESTION_DELETE=per eliminare "le domande di prova" selezionare le voci e fare clic sull`icona di eliminazione.
FLEXAM_HELP_QUESTION_ADD=Per aggiungere "domande quiz" premere l`icona Create.
FLEXAM_HELP_QUESTION_EDIT=Per modificare le "domande di prova", selezionare la voce e premere l`icona di modifica.
FLEXAM_HELP_QUESTION_ADD_DET=Il primo passo nella creazione di domande è quello di individuare il numero e la cui prova verrà assegnato.
FLEXAM_HELP_QUESTION_EDIT_DET=È possibile aggiungere o eliminare le questioni da un test. In primo luogo, è necessario selezionare una serie di questioni sul tavolo e poi premere l`icona Modifica. Modulo di modifica verrà visualizzata con la possibilità di aggiungere o eliminare le domande. Se si desidera eliminare le domande selezionate dal campo con la lista delle domande del test e premere il pulsante Continua che si trova sul lato. Se si desidera aggiungere, indicare il numero di domande e premere il pulsante Continua, i problemi appaiono alla fine del modulo con la possibilità di configurare nello stesso modo come ha fatto quando ha creato le domande di cui sopra.
FLEXAM_HELP_QUESTION_FORM_OPTIONS=La forma di creazione ed editing di "domande di prova" vi permetterà di porre domande in diversi formati tenendo conto:
FLEXAM_HELP_QUESTION_ALT=ALTERNATIVE: è possibile creare domande con risposte in considerazione la separazione punto e virgola (;), senza spazi dovrebbero consentire più di una risposta corretta. La correzione di questo tipo di domanda è rigida, in modo da non destinare una parte del punteggio se la risposta è parzialmente corretto.
FLEXAM_HELP_QUESTION_REL=RELAZIONI: La logica di questo tipo di questione è simile a questioni di alternative, per questo motivo devono indicare il numero di risposte corrette in sequenza ordinata. La correzione di questo tipo di domanda è rigida, in modo da non destinare una parte del punteggio se la risposta è parzialmente corretto.
FLEXAM_HELP_QUESTION_TOF=FALSE o VERO: è necessario assicurarsi di informare l`utente attraverso le istruzioni del test della parola si deve utilizzare per rispondere a tali domande, esso deve corrispondere la parola che hai detto come una risposta corretta. La correzione di questo tipo di domanda è rigida.
FLEXAM_HELP_QUESTION_OPN=APERTO: Si deve segnalare un elenco di concetti importanti separati da (,) senza spazi, come risposta giusta. Ogni concetto corrisponde ad un punto, quindi ci deve essere coerenza tra i concetti e il rating assegnato alla domanda. La correzione di questo tipo di questione assegna un punto per ogni concetto presente nell`elenco di cui al testo della risposta degli utenti.
FLEXAM_HELP_ANSWER_INTRO=Risposte test sezione, consente di esaminare i risultati dei test. Inoltre, è possibile eliminare le mail o risposte multiple contemporaneamente.
FLEXAM_HELP_ANSWER_ICONS=Il menu a icone consente di pubblicare, visualizzare i dettagli ed eliminare le risposte esistenti.
FLEXAM_HELP_ANSWER_PREVIEW=Per visualizzare una risposta da un test, selezionare la voce e fare clic sull`icona Anteprima.
FLEXAM_HELP_ANSWER_DELETE=Per rimuovere le risposte esistenti, selezionare gli elementi e fare clic sull`icona di eliminazione.
FLEXAM_HELP_ANSWER_MAIL=Per e-mail le risposte a un test, selezionare gli elementi e premere l`icona di inviare la posta. Una sintesi dei risultati verrà inviato all`utente e l`amministratore del corso.
FLEXAM_HELP_ANSWER_PRINT=Stampa un risultato del test è semplice, selezionare la risposta dell`utente e premere l`icona di anteprima, quindi premere l`icona di stampa.
FLEXAM_HELP_CONFIG_DELETE=Per eliminare le impostazioni di configurazione fare clic sull`icona di eliminazione, questo evento sarà pulire tutte le opzioni e salvare le modifiche.
FLEXAM_HELP_CONFIG_ADD=Per impostare le impostazioni di configurazione, completare le voci corrispondenti e precione icona Salva.
FLEXAM_HELP_CONFIG_INTRO=Possibilità di configurare alcuni aspetti di Flexam sono:
FLEXAM_HELP_CONFIG_TITLE_TEST=Titolo della sezione: è possibile impostare un titolo sulla pagina che l`utente può vedere. Queste informazioni sono utili per differenziare una società di scopo o del componente.
FLEXAM_HELP_CONFIG_STACK_MODE=modalità singola prova: Permette agli utenti di una restrizione sul numero di volte che è possibile eseguire un test. Di default l`opzione è attivata impedire un test da effettuare più di una volta. Disabilitando questa opzione, gli utenti che hanno effettuato l`accesso e tenere una prova può essere ripetuta senza restrizioni, mentre gli utenti che accedono per la connessione al server, può ripetere se hanno un codice diverso di applicazione. Se vi è più di un test per un corso tenuto da utenti che accedono connessione del server con il codice stessa applicazione, eseguire le seguenti prove della batteria.
FLEXAM_HELP_CONFIG_REQSERV query=Server: è possibile estrarre, report e registrare i dati ottenuti da un sito web o server remoto. L`impostazione di questa opzione, la richiesta di accesso remoto ambiete indicando l`URL "http:// [mia] dns / index.php? Opzione com_flexam=[commerciale] cc=codice []", definendo il codice come "Codice di applicazione", Flexam individuare il server inviando il codice per eseguire query restituisce un dato un`applicazione esterna in formato [nome utente]:: [Mail User]:: [CODICE DI CORSO], con questi dati dell`utente vengono generati automaticamente se non esistono e riunione inizierà l`invio della prima delle prove create per il corso.
FLEXAM_HELP_CONFIG_RESPSERV Server=Conferma: Permette la gestione del sito o del server che invia il codice di applicazione per gli utenti che hanno avuto accesso collegando server. L`idea è quella di avere una domanda su questa pagina, a consultare sulla base di detto codice, lo stato di approvazione degli utenti. La domanda dovrà verificare lo stato di approvazione del URL="http:// [mia] dns / components / com_flexam / result.php? Id=Codice []"
FLEXAM_HELP_CONFIG_TIME=Tempo redirect: per un utente di accedere collegando server, al termine del test verrà inviato l`indirizzo Web osservato in questo spazio.
FLEXAM_HELP_CONFIG_MAILSERV=i dati relativi allegati di posta elettronica: consente a un URL da cui è estratto da una funzione di sistema, i dati da inserire nel corpo della mail. Ad esempio, si può avere una pagina con annunci di corsi di applicare, a tali elenchi sono inclusi nella mail se si assegna l`indirizzo web.