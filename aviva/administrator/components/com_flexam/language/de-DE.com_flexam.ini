FLEXAM_HELP_AREAS_INTRO=Flexam Tests zu erstellen, müssen Sie zunächst "Gebieten des Wissens". Die "Areas of Knowledge" wird sichtbar, wenn sie auf den Zustand "veröffentlicht."
FLEXAM_HELP_AREAS_ICONS=Das Icon-Menü ermöglicht Ihnen das Erstellen neuer "Gebieten des Wissens", Bearbeiten und Löschen bestehender.
FLEXAM_HELP_AREAS_PUBLISH=zu veröffentlichen oder unpublish "Gebieten des Wissens" wählen Sie den Eintrag und klicken Sie auf das Symbol der Veröffentlichung. Sie können das Symbol in der Spalte auf "Public" in der Tabelle Liste der Elemente zur Veränderung des Status eines bestimmten Elements.
FLEXAM_HELP_AREAS_DELETE=So löschen Sie "Gebieten des Wissens" wählen Sie den Eintrag und klicken Sie auf das Symbol der Eliminierung.
FLEXAM_HELP_AREAS_ADD=So fügen Sie "Gebieten des Wissens" drücken Sie die Create-Symbol.
FLEXAM_HELP_AREAS_EDIT=So bearbeiten Sie "Gebieten des Wissens" wählen Sie den Eintrag und drücken die Schaltfläche Bearbeiten.
FLEXAM_HELP_AREAS_FORM_OPTIONS=In das Formular zum Bearbeiten oder Erstellen von "Gebieten des Wissens"-Option muss der Titel abzuschließen. Das Bild ist eine Ikone des 64 x 64 Pixel oder 18 MB. Wenn Sie beinhalten nicht eine Nummer zugewiesen, das Symbol System.
FLEXAM_HELP_SUBJECT_INTRO=Create "-Kurse von Gebieten" ermöglicht Themen oder Themen, über die zukünftige Studien erstellt werden. Die "Kurse Gebiete" wird sichtbar, wenn sie den Zustand "meet" veröffentlicht.
FLEXAM_HELP_SUBJECT_ICONS=Das Icon-Menü ermöglicht Ihnen das Erstellen neuer "Kurse von Gebieten", Bearbeiten und Löschen bestehender.
FLEXAM_HELP_SUBJECT_PUBLISH=zu veröffentlichen oder unpublish "Kurse von Gebieten" wählen Sie den Eintrag und klicken Sie auf das Symbol der Veröffentlichung. Sie können das Symbol in der Spalte auf "Public" in der Tabelle Liste der Elemente zur Veränderung des Status eines bestimmten Elements.
FLEXAM_HELP_SUBJECT_DELETE=Zum Löschen "-Kurse von Gebieten" wählen Sie den Eintrag und klicken Sie auf das Symbol der Eliminierung.
FLEXAM_HELP_SUBJECT_ADD=So fügen Sie "Kurse von Gebieten" drücken Sie die Create-Symbol.
FLEXAM_HELP_SUBJECT_EDIT=Zum Bearbeiten "-Kurse von Gebieten" wählen Sie den Eintrag und drücken die Schaltfläche Bearbeiten.
FLEXAM_HELP_SUBJECT_FORM_OPTIONS=In das Formular zu bearbeiten oder zu erstellen "-Kurse von Orten", füllen Sie die Optionen Titel, Raum des Wissens, die auf Typ hängt, Mail-und Code. Der Administrator ist mail mail aus dem Kurs Vorgesetzten, diese Person von jedem Test wird durchgeführt mitgeteilt werden. Der Code der Wert, der einen Kurs in der Kommunikation mit anderen Servern oder Bereiche Ihrer Website zu identifizieren. Die "MODE" verändert den Körper und den Empfänger der Mail an den Benutzer gesendet, wo sie aufmerksam gemacht ihre Ergebnisse sind. So, die Kurse "ZU" wird eine E-Mail an den Administrator zu erzeugen und nicht der Benutzer. Die Kurse "OPEN" Senden von Mail an den Administrator und den Benutzer mit einer Zusammenfassung der erzielten Ergebnisse.
FLEXAM_HELP_TEST_INTRO=Die "Prüfung der Kurse" können Sie Einstellungen für zukünftige Tests eingestellt. Ein Test ist ein Messgerät sollten Anweisungen haben, Schwierigkeitsgrad, maximale Qualität, minimale und Genehmigung. Diese Parameter sind die Grundlage für den Algorithmus zur automatischen Korrektur testen. Die "Prüfung der Kurse" wird sichtbar, wenn sie den Zustand "Veröffentlichen".
FLEXAM_HELP_TEST_ICONS=Das Icon-Menü ermöglicht Ihnen das Erstellen neuer "Tests natürlich", Bearbeiten und Löschen bestehender.
FLEXAM_HELP_TEST_PUBLISH=zu veröffentlichen oder unpublish "Tests natürlich" wählen Sie den Eintrag und klicken Sie auf das Symbol der Veröffentlichung. Sie können das Symbol in der Spalte auf "Public" in der Tabelle Liste der Elemente zur Veränderung des Status eines bestimmten Elements.
FLEXAM_HELP_TEST_DELETE=So löschen Sie "Teststrecke" Wählen Sie das Element und drücken Sie auf das Symbol der Eliminierung.
FLEXAM_HELP_TEST_ADD=So fügen Sie "Tests natürlich" drücken Sie die Create-Symbol.
FLEXAM_HELP_TEST_EDIT=Zum Bearbeiten "-Tests natürlich" wählen Sie den Eintrag und drücken die Schaltfläche Bearbeiten.
FLEXAM_HELP_TEST_FORM_OPTIONS=In das Formular zu bearbeiten oder zu erstellen "Testen der Kurse", komplett den Titel-Optionen, Anweisungen, in denen Schwierigkeiten, maximale Qualität, minimale und Zulassung abhängig. Die Schwierigkeit besteht darin, die Punktzahl Zusammenhang, Minimum und Maximum, wobei diese Grenzen erzeugt einen Maßstab in Bezug auf die Schwierigkeit. Für jeden Punkt erzielte im Test die Note erhöht auf der Grundlage der Skala erreicht.
FLEXAM_HELP_QUESTION_INTRO=Wenn Sie die Test-Konfiguration in der "Prüfung der Kurse", können wir die Testfragen geschaffen werden. Jede Frage hat eine Partitur, Typ, richtige Antwort, den Körper des Frage-und Test zu dem es gehört. Als ersten Schritt bei der Schaffung von Fragen, müssen Sie die Anzahl der Testfragen und deuten darauf hin, zu dem es gehört.
FLEXAM_HELP_QUESTION_ICONS=Das Icon-Menü ermöglicht Ihnen das Erstellen neuer "Testfragen", Bearbeiten, Kopieren und Löschen bestehender.
FLEXAM_HELP_QUESTION_COPY=auf Fragen von einem Test auf einen anderen kopieren, wählen Sie eine Reihe von Fragen auf den Tisch und drücken Sie die Kopieren-Symbol. Ein Formular wird angezeigt, mit Angabe der Nachweis des Ursprungs und ermöglichen Sie den Test Ziel auszuwählen. Speichern Sie Ihre Änderungen.
FLEXAM_HELP_QUESTION_DELETE=Zur Beseitigung "Testfragen" wählen Sie die Produkte und klicken Sie auf das Symbol der Eliminierung.
FLEXAM_HELP_QUESTION_ADD=So fügen Sie "Quizfragen" drücken Sie die Create-Symbol.
FLEXAM_HELP_QUESTION_EDIT=So bearbeiten Sie "Testfragen" wählen Sie den Eintrag und drücken die Schaltfläche Bearbeiten.
FLEXAM_HELP_QUESTION_ADD_DET=Der erste Schritt bei der Schaffung von Fragen ist, die Zahl zu ermitteln und den Nachweis von denen zugeteilt werden.
FLEXAM_HELP_QUESTION_EDIT_DET=Sie können hinzufügen oder löschen, Fragen aus einem Test. Zunächst müssen Sie eine Reihe von Fragen auf den Tisch und drücken Sie anschließend die Schaltfläche Bearbeiten. Das Bearbeiten-Formular wird mit Optionen hinzuzufügen oder zu löschen Fragen angezeigt werden. Wenn Sie das ausgewählte Fragen aus dem Bereich mit der Liste der Testfragen zu löschen und drücken Sie die Schaltfläche Weiter, dass auf der Seite ist. Wenn Sie hinzufügen möchten, geben Sie die Anzahl der Fragen und drücken Sie die Schaltfläche "Weiter", die Fragen am Ende des Formulars mit der Fähigkeit, wie sie bei der oben genannten Fragen erstellt hat configure erscheinen.
FLEXAM_HELP_QUESTION_FORM_OPTIONS=Das Formular zum Erstellen und Bearbeiten von "Testfragen" ermöglicht es Ihnen, Fragen in verschiedenen Formaten unter Berücksichtigung fragen:
FLEXAM_HELP_QUESTION_ALT=Alternativen: Sie können Fragen und Antworten unter Berücksichtigung Trennung Semikolon (schaffen;), sollte keine Leerzeichen erlaubt mehr als eine richtige Antwort. Die Korrektur dieser Art von Frage ist streng, so dass es keine Zuteilung Teil der Partitur, wenn die Antwort ist teilweise richtig.
FLEXAM_HELP_QUESTION_REL=Matching: Die Logik dieser Art von Frage ist ähnlich zu den Fragen von Alternativen, aus diesem Grund sollte die Zahl der richtigen Antworten geben nacheinander bestellt. Die Korrektur dieser Art von Frage ist streng, so dass es keine Zuteilung Teil der Partitur, wenn die Antwort ist teilweise richtig.
FLEXAM_HELP_QUESTION_TOF=TRUE oder FALSE: Sie sollten sicherstellen, um den Benutzer durch den Prüfanweisungen des Wortes zu informieren, müssen Sie verwenden, um solche Fragen zu beantworten, muss es passen Sie das Wort als eine richtige Antwort, sagte. Die Korrektur dieser Art von Frage ist streng.
FLEXAM_HELP_QUESTION_OPN=OPEN: Du musst Bericht eine Liste der wichtigsten Konzepte von (,) ohne Abstände, wie richtige Antwort getrennt. Jedes Konzept entspricht einem Punkt, so muss eine völlige Übereinstimmung zwischen den Konzepten und der Bewertung auf die Frage sein. Die Korrektur dieser Art von Frage weist einen Punkt für jeden Begriff gefunden in der genannten Liste in den Text des Benutzers Antwort.
FLEXAM_HELP_ANSWER_INTRO=Abschnitt Test Antworten, können Sie die Ergebnisse der Tests zu überprüfen. Darüber hinaus können Sie E-Mail oder eliminieren gleichzeitig mehrere Antworten.
FLEXAM_HELP_ANSWER_ICONS=Das Icon-Menü können Sie auf dem Postweg, Details und die Beseitigung der vorhandenen Antworten.
FLEXAM_HELP_ANSWER_PREVIEW=Um eine Antwort von einem Test, wählen Sie den Eintrag und klicken Sie auf das Vorschau-Symbol.
FLEXAM_HELP_ANSWER_DELETE=zur Beseitigung vorhandener Reaktionen, wählen Sie die Produkte und klicken Sie auf das Symbol der Eliminierung.
FLEXAM_HELP_ANSWER_MAIL=An E-Mail-Antworten von einem Test, wählen Sie die Artikel und drücken Sie die E-Mail-Symbol. Eine Zusammenfassung der Ergebnisse wird an den Benutzer gesendet werden und der Administrator des Kurses.
FLEXAM_HELP_ANSWER_PRINT=Drucken eines Testergebnisses ist einfach, wählen Sie die Antwort des Benutzers, und drücken Sie die Vorschau-Symbol, und drücken Sie dann auf das Symbol Drucken.
FLEXAM_HELP_CONFIG_DELETE=Um die Konfigurationseinstellungen zu löschen klicken Sie auf das Symbol der Beseitigung, wird diese Veranstaltung saubere alle Optionen und speichern Sie die Änderungen.
FLEXAM_HELP_CONFIG_ADD=Um die Konfigurationseinstellungen, füllen Sie die entsprechenden Items und precione Symbol Speichern.
FLEXAM_HELP_CONFIG_INTRO=Mögliche Aspekte des Flexam konfiguriert werden:
FLEXAM_HELP_CONFIG_TITLE_TEST=Titel für den Abschnitt: Sie können einen Titel auf der Seite, die der Benutzer sehen kann eingestellt. Diese Information ist nützlich, um ein Unternehmen oder einen bestimmten Zweck des Bauteils zu differenzieren.
FLEXAM_HELP_CONFIG_STACK_MODE=Single Test-Modus: Ermöglicht es Benutzern, eine Beschränkung der Anzahl von Zeiten können Sie einen Test durchführen. Standardmäßig ist die Option aktiviert ist, verhindert ein Test mehr als einmal durchgeführt werden. Durch das Deaktivieren dieser Option können Benutzer, die angemeldet sind und halten einen Test kann ohne Einschränkung wiederholt werden, während die Benutzer, die Zugang zum Server-Verbindung kann zu wiederholen, wenn sie eine andere Anwendung Code. Wo gibt es mehr als ein Test für einen Kurs von den Benutzern den Zugriff auf Server-Verbindung mit der gleichen Anwendung Code angegeben, führen Sie die folgenden Tests der Batterie.
FLEXAM_HELP_CONFIG_REQSERV=Server-Abfrage: extrahieren können, melden und die Daten von einer Webseite oder Remote-Server erhalten. Das Setzen dieser Option, Ambiete Antrag Remote-Zugriff auf die URL "http:// [meine DNS] / index.php zeigt option=com_flexam [Zeichen] cc=[code]", die Festlegung Code wie "Anwendungs-Code", Flexam Suchen Sie den Server, indem Sie den Code an eine externe Anwendung gibt Daten in Abfrage-Format [Benutzername]:: [MAIL USER]:: [natürlich] Code, mit diesen Benutzerdaten werden automatisch generiert, wenn nicht vorhanden und Treffen wird zum Senden der erste Tests für den Kurs angelegt.
FLEXAM_HELP_CONFIG_RESPSERV=Bestätigung Server: Ermöglicht die Verwaltung der Website oder den Server, dass die Anwendung Code sendet für Anwender, die durch die Verbindung von Servern zugegriffen haben. Die Idee ist, einen Antrag auf dieser Seite haben, um auf der Grundlage der genannten Code zu konsultieren, die Genehmigung Status des Nutzers. Der Antrag sollte den Status der Genehmigung der URL="http:// [meine DNS] / components / com_flexam / result.php? Id=[code]"
FLEXAM_HELP_CONFIG_TIME redirect=Time: Bei einem Benutzer den Zugriff auf Server, indem Sie am Ende Ihres Tests wird die Web-Adresse geschickt werden an dieser Stelle darauf hingewiesen.
FLEXAM_HELP_CONFIG_MAILSERV=Daten für Mail-Anhänge: Ermöglicht eine URL, aus denen durch ein System-Funktion extrahiert wird, um Daten in den Körper der Mail enthalten sein. Zum Beispiel können Sie eine Seite mit Anzeigen von Kursen zu gelten, sind diese Listen in der Mail enthalten, wenn Sie die Web-Adresse zuzuweisen.