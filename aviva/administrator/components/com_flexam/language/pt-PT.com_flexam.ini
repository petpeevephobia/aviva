FLEXAM_HELP_AREAS_INTRO=Flexam criar testes, primeiro você deve criar "áreas de conhecimento". As áreas do conhecimento será visível se eles estão no estado" publicado ".
FLEXAM_HELP_AREAS_ICONS=O ícone do menu permite criar novas "áreas de conhecimento", editar e apagar as já existentes.
FLEXAM_HELP_AREAS_PUBLISH=Para publicar ou despublicar "Áreas do Conhecimento", selecione o item e clique no ícone da sua publicação. Você pode pressionar o ícone na coluna "Público" na lista de tabela de elementos para mudar o status de um item específico.
FLEXAM_HELP_AREAS_DELETE=excluir "Áreas do Conhecimento", selecione o item e clicar no ícone de eliminação.
FLEXAM_HELP_AREAS_ADD=Para adicionar "Áreas do Conhecimento" pressione o ícone Create.
FLEXAM_HELP_AREAS_EDIT=Para editar "Áreas do Conhecimento", selecione o item e pressione o ícone de edição.
FLEXAM_HELP_AREAS_FORM_OPTIONS=No formulário para edição ou criação de "Áreas do Conhecimento" opção deve completar o título. A imagem é um ícone de 64 x 64 pixels e 18 MB. Se você não incluir um número atribuído o ícone do sistema.
FLEXAM_HELP_SUBJECT_INTRO=Criar "cursos das áreas" permite que temas ou questões em que estudos futuros será criado. Os "cursos" áreas serão visíveis se encontrar no estado "publicado".
FLEXAM_HELP_SUBJECT_ICONS=O ícone do menu permite que você crie novos "cursos das áreas", editar e apagar as já existentes.
FLEXAM_HELP_SUBJECT_PUBLISH=Para publicar ou despublicar "CURSOS DE ÁREAS", selecione o item e clique no ícone da sua publicação. Você pode pressionar o ícone na coluna "Público" na lista de tabela de elementos para mudar o status de um item específico.
FLEXAM_HELP_SUBJECT_DELETE=Para excluir "os cursos das áreas" selecione o item e clicar no ícone de eliminação.
FLEXAM_HELP_SUBJECT_ADD=Para adicionar "cursos das áreas" pressione o ícone Create.
FLEXAM_HELP_SUBJECT_EDIT=Para editar "os cursos das áreas" selecione o item e pressione o ícone de edição.
FLEXAM_HELP_SUBJECT_FORM_OPTIONS=No formulário para editar ou criar "cursos de lugares", completa o título de opções, a área de conhecimento que depende do tipo, e-mail e código. O e-mail é administrador e-mail do supervisor do curso, essa pessoa será comunicada por cada teste realizado. O código o valor que irá identificar o curso de comunicação com outros servidores ou seções de seu site. O modo "altera o corpo eo destinatário do e-mail enviado para o usuário onde estão cientes dos seus resultados. Assim, os cursos fechados "irá gerar um e-mail para o administrador e não o usuário. Os cursos de "OPEN" enviar e-mail ao administrador e ao usuário um resumo dos resultados obtidos.
FLEXAM_HELP_TEST_INTRO=O "testando os cursos" permite que você defina as configurações para futuros testes. Um teste é um instrumento de medição deve ter instruções, o nível de dificuldade, a nota máxima, mínima e aprovação. Esses parâmetros são a base para que o algoritmo para teste de correção automático. O "testando os cursos" será visível se encontrar no estado "Publish".
FLEXAM_HELP_TEST_ICONS=O ícone do menu permite criar novas "TESTES DE CURSO", editar e apagar as já existentes.
FLEXAM_HELP_TEST_PUBLISH=Para publicar ou despublicar "TESTES DE CURSO", selecione o item e clique no ícone da sua publicação. Você pode pressionar o ícone na coluna "Público" na lista de tabela de elementos para mudar o status de um item específico.
FLEXAM_HELP_TEST_DELETE=Para excluir "TESTE DO CURSO" selecione o item e pressione o ícone de eliminação.
FLEXAM_HELP_TEST_ADD=Para adicionar "TESTES DE CURSO" pressione o ícone Create.
FLEXAM_HELP_TEST_EDIT=Para editar "TESTES DE CURSO", selecione o item e pressione o ícone de edição.
FLEXAM_HELP_TEST_FORM_OPTIONS=No formulário para editar ou criar "testar os cursos", completa as opções de título, instruções, durante o qual depende de dificuldade, nota máxima, mínima e aprovação. A dificuldade está relacionada com a pontuação passando, mínimo e máximo, com esses limites gera uma escala relacionado com a dificuldade. Para cada ponto marcado no teste aumenta a nota obtida na base da escala.
FLEXAM_HELP_QUESTION_INTRO=Depois de definir a configuração do ensaio na "testar os cursos", podemos criar as perguntas do teste. Cada pergunta tem uma pontuação, tipo, a resposta correta, o corpo da pergunta e teste a que pertence. Como um primeiro passo na criação de perguntas, você deve indicar o número de questões e teste a que pertence.
FLEXAM_HELP_QUESTION_ICONS=O ícone do menu permite que você crie novas questões "test", editar, copiar e excluir os existentes.
FLEXAM_HELP_QUESTION_COPY=Para copiar as questões de um teste para outro, selecione um conjunto de questões sobre a mesa e pressione o ícone Copiar. Um formulário será exibido, indicando a prova da origem e permitindo que você selecione o alvo do teste. Salve as alterações.
FLEXAM_HELP_QUESTION_DELETE=Para eliminar "perguntas do teste", selecione os itens e clique no ícone de eliminação.
FLEXAM_HELP_QUESTION_ADD=Para adicionar "perguntas do quiz" pressione o ícone Create.
FLEXAM_HELP_QUESTION_EDIT=Para editar "perguntas do teste", selecione o item e pressione o ícone de edição.
FLEXAM_HELP_QUESTION_ADD_DET=O primeiro passo é criar perguntas para identificar o número ea prova de que será atribuído.
FLEXAM_HELP_QUESTION_EDIT_DET=Você pode adicionar ou excluir perguntas de um teste. Primeiro, você deve selecionar um conjunto de questões sobre a mesa e pressione o ícone Editar. O formulário de edição será exibida com opções para adicionar ou excluir perguntas. Se você quiser excluir as perguntas selecionadas do campo com a lista de perguntas do teste e pressione o botão Continue que está ao lado. Se quiser acrescentar, indicar o número de questões e pressione o botão Continuar, as perguntas que aparecem no final do formulário com a capacidade de configurar da mesma forma como fez quando criou as perguntas acima.
FLEXAM_HELP_QUESTION_FORM_OPTIONS=A criação do formulário e edição de "perguntas do teste" permitirá que você faça perguntas em diferentes formatos, considerando:
FLEXAM_HELP_QUESTION_ALT=ALTERNATIVAS: Você pode criar perguntas com respostas, considerando que separa vírgula (;), espaços não devem permitir que mais de uma resposta correta. A correcção deste tipo de questão é rigorosa, por isso não afectar uma parte da nota, se a resposta está parcialmente correta.
FLEXAM_HELP_QUESTION_REL=ALINHAMENTO: A lógica deste tipo de pergunta é similar às questões de alternativas, por esse motivo, devem indicar o número de acertos ordenados sequencialmente. A correcção deste tipo de questão é rigorosa, por isso não afectar uma parte da nota, se a resposta está parcialmente correta.
FLEXAM_HELP_QUESTION_TOF=FALSE OU VERDADE: você deve certificar-se de informar o usuário através de instruções de teste a palavra que você tem que usar para responder a essas questões, deve coincidir com a palavra que você disse como resposta correta. A correcção deste tipo de questão é rigorosa.
FLEXAM_HELP_QUESTION_OPN=ABERTO: Você deve informar uma lista de importantes conceitos separados por (,) sem espaços, como resposta correta. Cada conceito corresponde a um ponto, então deve haver coerência total entre os conceitos ea classificação dada à questão. A correcção deste tipo de questão atribui um ponto para cada conceito encontrado na lista mencionada no texto de resposta do usuário.
FLEXAM_HELP_ANSWER_INTRO=Secção respostas dos testes , permite analisar os resultados dos testes. Além disso, você poderá enviar ou eliminar várias respostas simultaneamente.
FLEXAM_HELP_ANSWER_ICONS=O ícone do menu permite que você publique, ver detalhes e eliminar as respostas existentes.
FLEXAM_HELP_ANSWER_PREVIEW=Para ver uma resposta de um teste, selecione o item e clique no ícone de visualização.
FLEXAM_HELP_ANSWER_DELETE=Para remover respostas existentes, selecione os itens e clique no ícone de eliminação.
FLEXAM_HELP_ANSWER_MAIL=Para e-mail de um teste, selecione os itens e pressione o ícone Enviar Mail. Um resumo dos resultados será enviado para o usuário eo administrador do curso.
FLEXAM_HELP_ANSWER_PRINT=Imprimir um resultado do teste é simples, escolha a resposta do usuário e pressione o ícone de visualização, pressione o ícone de impressão.
FLEXAM_HELP_CONFIG_DELETE=Para excluir clique em configurações no ícone de eliminação, este evento irá limpar todas as opções e salvar as alterações.
FLEXAM_HELP_CONFIG_ADD=Para definir as definições de configuração, preencha os itens correspondentes e ícone Save precione.
FLEXAM_HELP_CONFIG_INTRO=Possível configurar aspectos Flexam são:
FLEXAM_HELP_CONFIG_TITLE_TEST=Título para a seção: Você pode definir um título na página que o usuário pode ver. Esta informação é útil para diferenciar uma empresa ou a finalidade do componente.
FLEXAM_HELP_CONFIG_STACK_MODE=Modo de teste simples: Permite aos usuários uma restrição sobre o número de vezes que você pode fazer um teste. Por padrão, a opção é ativada impedir um teste a ser realizado mais de uma vez. Ao desativar esta opção, os usuários que se registraram e realizar um teste pode ser repetido sem restrições, enquanto os usuários que acessam a conexão com o servidor, pode repetir se eles têm um código de aplicação diferentes. Onde houver mais de um teste para um curso ministrado por usuários que acessam conexão com o servidor com o código do aplicativo mesmo, execute os seguintes testes da bateria.
FLEXAM_HELP_CONFIG_REQSERV=Consulta Server: pode extrair, o relatório e registrar os dados obtidos a partir de um servidor remoto ou website. Definir esta opção, o pedido de acesso remoto ambiete apontando para a URL "http:// [meu] dns / index.php? [Opção com_flexam=comercial] cc=[code]", definindo um código como "aplicação do código", Flexam localizar o servidor, enviando o código para uma consulta de dados retorna aplicação externa no formato [USER NAME]:: [Mail User]:: [CÓDIGO DO CURSO], com esses dados de usuário é gerada automaticamente se não existe e encontro vai começar a enviar o primeiro dos testes criados para o curso.
FLEXAM_HELP_CONFIG_RESPSERV=Server Confirmação: Permite o gerenciamento do site ou servidor que envia o código do aplicativo para usuários que tenham acessado por ligação servidores. A idéia é ter um aplicativo nesta página, para consultas sobre a base do referido código, o status de aprovação do usuário. O aplicativo deve verificar o status de aprovação do URL="http:// [] meu dns / components / com_flexam / result.php? Id=[code]"
FLEXAM_HELP_CONFIG_TIME Time=Redirect: Para que um usuário de acesso, ligando os servidores, no final do seu teste será enviado para o endereço da Web observar neste espaço.
FLEXAM_HELP_CONFIG_MAILSERV=Dados para anexos de e-mail: Permite uma URL a partir da qual é extraído por uma função do sistema, os dados a serem incluídos no corpo do e-mail. Por exemplo, você pode ter uma página com anúncios de cursos para aplicar, estas listas são incluídas no e-mail se você atribuir o endereço da web.